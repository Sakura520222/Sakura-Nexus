name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: golangci-lint
        run: golangci-lint run

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: sakura_test
          MYSQL_USER: sakura
          MYSQL_PASSWORD: test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestroot"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
    env:
      SAKURA_TEST_MYSQL_HOST: 127.0.0.1
      SAKURA_TEST_MYSQL_PORT: "3306"
      SAKURA_TEST_MYSQL_USER: sakura
      SAKURA_TEST_MYSQL_PASSWORD: test
      SAKURA_TEST_MYSQL_DATABASE: sakura_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests (MySQL)
        run: go test -race -tags integration ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
